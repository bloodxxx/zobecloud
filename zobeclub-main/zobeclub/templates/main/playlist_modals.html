<!-- Модальное окно создания плейлиста -->
<div class="modal fade" id="createPlaylistModal" tabindex="-1" aria-labelledby="createPlaylistModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark">
      <div class="modal-header border-secondary">
        <h5 class="modal-title text-white" id="createPlaylistModalLabel">
          <i class="fas fa-list-music me-2"></i>Создать новый плейлист
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <form method="post" action="{% url 'create_playlist' %}" enctype="multipart/form-data" class="needs-validation" novalidate>
        <div class="modal-body">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="playlistTitle" class="form-label text-white">Название плейлиста <span class="text-danger">*</span></label>
            <input type="text" class="form-control bg-secondary text-white border-0" id="playlistTitle" name="title" required maxlength="200" placeholder="Введите название плейлиста">
            <div class="invalid-feedback">Введите название плейлиста</div>
          </div>
          
          <div class="mb-3">
            <label for="playlistDescription" class="form-label text-white">Описание</label>
            <textarea class="form-control bg-secondary text-white border-0" id="playlistDescription" name="description" rows="3" placeholder="Опишите ваш плейлист (необязательно)"></textarea>
          </div>
          
          <div class="mb-3">
            <label for="playlistVisibility" class="form-label text-white">Видимость</label>
            <select class="form-select bg-secondary text-white border-0" id="playlistVisibility" name="visibility">
              <option value="public">Публичный - виден всем</option>
              <option value="unlisted">По ссылке - виден только по прямой ссылке</option>
              <option value="private">Приватный - виден только вам</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label for="playlistCover" class="form-label text-white">Обложка плейлиста</label>
            <input type="file" class="form-control bg-secondary text-white border-0" id="playlistCover" name="cover" accept="image/*">
            <div class="form-text text-muted">Поддерживаются форматы: JPG, PNG, GIF. Максимальный размер: 5MB</div>
          </div>
        </div>
        
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Создать плейлист
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
/* Стили для плейлистов */
.playlists-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
}

.playlist-card {
  background: var(--bg-secondary, #2a2a2a);
  border: 1px solid var(--border-color, #444);
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.playlist-card:hover {
  border-color: var(--accent-green, #39ff14);
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

.playlist-cover-container {
  position: relative;
  width: 100%;
  height: 200px;
  overflow: hidden;
}

.playlist-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.playlist-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all 0.3s ease;
}

.playlist-card:hover .playlist-overlay {
  opacity: 1;
}

.playlist-overlay .play-btn {
  background: none;
  border: none;
  color: var(--accent-green, #39ff14);
  font-size: 3rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.playlist-overlay .play-btn:hover {
  color: #4eff28;
  transform: scale(1.1);
}

.playlist-visibility-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
}

.playlist-info {
  padding: 1rem;
}

.playlist-title {
  margin: 0 0 0.5rem 0;
  font-size: 1rem;
  font-weight: 600;
}

.playlist-link {
  color: var(--text-primary, #fff);
  text-decoration: none;
  transition: color 0.3s ease;
}

.playlist-link:hover {
  color: var(--accent-green, #39ff14);
}

.playlist-stats {
  margin: 0;
  color: var(--text-secondary, #aaa);
  font-size: 0.9rem;
}

@media (max-width: 768px) {
  .playlists-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
}

@media (max-width: 576px) {
  .playlists-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
// Функции для работы с плейлистами
function loadUserPlaylists() {
  const container = document.getElementById('playlistsContainer');
  if (!container) return;
  
  fetch('/api/user-playlists/')
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        if (data.playlists.length > 0) {
          container.innerHTML = '';
          data.playlists.forEach(playlist => {
            const playlistCard = createPlaylistCard(playlist);
            container.appendChild(playlistCard);
          });
        } else {
          container.innerHTML = `
            <div class="text-center py-5">
              <i class="fas fa-list-music fa-4x text-muted mb-3"></i>
              <h5 class="text-white">Пока нет плейлистов</h5>
              <p class="text-muted">Создайте свой первый плейлист, чтобы организовать треки</p>
              <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createPlaylistModal">
                <i class="fas fa-plus me-2"></i>Создать первый плейлист
              </button>
            </div>
          `;
        }
      } else {
        container.innerHTML = '<p class="text-muted text-center">Ошибка загрузки плейлистов</p>';
      }
    })
    .catch(error => {
      console.error('Error loading playlists:', error);
      container.innerHTML = '<p class="text-muted text-center">Ошибка загрузки плейлистов</p>';
    });
}

function createPlaylistCard(playlist) {
  const card = document.createElement('div');
  card.className = 'playlist-card';
  card.innerHTML = `
    <div class="playlist-cover-container">
      <img src="${playlist.cover_url}" alt="${playlist.title}" class="playlist-cover">
      <div class="playlist-overlay">
        <button class="play-btn" onclick="window.location.href='/playlist/${playlist.id}/'">
          <i class="fas fa-play-circle"></i>
        </button>
      </div>
      ${playlist.visibility !== 'public' ? `
        <div class="playlist-visibility-badge">
          <i class="fas fa-${playlist.visibility === 'private' ? 'lock' : 'link'}"></i>
        </div>
      ` : ''}
    </div>
    <div class="playlist-info">
      <h6 class="playlist-title">
        <a href="/playlist/${playlist.id}/" class="playlist-link">${playlist.title}</a>
      </h6>
      <p class="playlist-stats">${playlist.tracks_count} трек${getTrackWordEnding(playlist.tracks_count)}</p>
    </div>
  `;
  return card;
}

function getTrackWordEnding(count) {
  if (count % 10 === 1 && count % 100 !== 11) {
    return '';
  } else if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) {
    return 'а';
  } else {
    return 'ов';
  }
}

// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
  // Обработчик переключения на вкладку плейлистов
  const playlistsTab = document.querySelector('button[data-bs-target="#playlists"]');
  if (playlistsTab) {
    playlistsTab.addEventListener('shown.bs.tab', function() {
      loadUserPlaylists();
    });
  }
});
</script>
