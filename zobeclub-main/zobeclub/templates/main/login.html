{% extends 'main/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
    <h2 class="mb-4 text-center">Войти в аккаунт</h2>
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-danger">
          Пожалуйста, исправьте ошибки ниже.
        </div>
      {% endif %}

      <div class="mb-3">
        <label for="id_username" class="form-label">Имя пользователя</label>
        <input type="text" name="username" autofocus maxlength="150" required id="id_username" class="form-control" value="{{ form.username.value|default:'' }}">
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Пароль</label>
        <input type="password" name="password" required id="id_password" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>

    <p class="mt-3 text-center">
      Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
